name: StacksFlow Cycler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  cycle:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install SDK
        run: npm install @stacksflowr/my-sdk --save
        
      - name: Run one cycle
        run: |
          chmod +x cycle-stacksflow-ci.sh
          ./cycle-stacksflow-ci.sh
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-cycle: update colors/stats + SDK [skip ci]"
          git push
